<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Tra Cứu Điểm Học Sinh</title>
    <meta name="description"
        content="Chatbot AI tra cứu điểm số, xếp loại, thời khóa biểu, lịch thi và thông tin học sinh.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="newChatBtn" title="Cuộc hội thoại mới">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14" />
                </svg>
                <span>Chat mới</span>
            </button>
            <button class="sidebar-toggle-btn" id="closeSidebarBtn" title="Đóng sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </button>
        </div>

        <div class="sidebar-search">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <path d="M21 21l-4.35-4.35" />
            </svg>
            <input type="text" id="searchInput" placeholder="Tìm kiếm cuộc hội thoại..." autocomplete="off">
        </div>

        <nav class="chat-history" id="chatHistory">
            <!-- Rendered by JS -->
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-footer-info">
                <span class="footer-icon">📊</span>
                <span>Tra Cứu Điểm AI</span>
            </div>
        </div>
    </aside>

    <!-- ===== MAIN ===== -->
    <main class="main" id="main">
        <!-- Top bar -->
        <header class="topbar" id="topbar">
            <button class="sidebar-open-btn" id="openSidebarBtn" title="Mở sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12h18M3 6h18M3 18h18" />
                </svg>
            </button>
            <h1 class="topbar-title" id="topbarTitle">Chat mới</h1>
            <div class="topbar-actions" style="display: flex; align-items: center; gap: 15px;">
                <select id="llmProvider" class="provider-select" title="Chọn Mô Hình AI">
                    <option value="gemini" selected>Gemini (mặc định)</option>
                    <option value="groq">Qwen3 32B (Groq)</option>
                    <option value="openrouter">Nemotron 70B (OpenRouter)</option>
                    <option value="gemini_2_5_flash">Gemini 2.5 Flash</option>
                    <option value="gemini_2_0_flash">Gemini 2.0 Flash</option>
                    <option value="gemini_1_5_flash">Gemini 1.5 Flash</option>
                    <option value="gemini_1_5_flash_8b">Gemini 1.5 Flash 8B</option>
                </select>
                <div class="topbar-status" id="topbarStatus">
                    <span class="status-dot online"></span>
                    <span>Sẵn sàng</span>
                </div>
            </div>
        </header>

        <!-- Chat messages area -->
        <div class="chat-container" id="chatContainer">
            <!-- Welcome screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-logo">📊</div>
                <h2 class="welcome-title">Tra Cứu Điểm Học Sinh</h2>
                <p class="welcome-subtitle">Hỏi về điểm số, xếp loại, thời khóa biểu, lịch thi, giáo viên, điểm
                    danh...</p>

                <div class="suggestions" id="suggestions">
                    <button class="suggestion-card"
                        data-question="Xếp loại học lực học kỳ I của Nguyễn Nông Bảo An năm 2025-2026?">
                        <span class="suggestion-icon">📊</span>
                        <span class="suggestion-text">Xếp loại học lực học kỳ I?</span>
                    </button>
                    <button class="suggestion-card"
                        data-question="Điểm trung bình lớp 6A môn Toán học kỳ I năm 2025-2026?">
                        <span class="suggestion-icon">📈</span>
                        <span class="suggestion-text">Điểm trung bình lớp 6A môn Toán?</span>
                    </button>
                    <button class="suggestion-card"
                        data-question="Giáo viên chủ nhiệm lớp 6A năm học 2025-2026 là ai?">
                        <span class="suggestion-icon">👩‍🏫</span>
                        <span class="suggestion-text">Giáo viên chủ nhiệm lớp 6A?</span>
                    </button>
                    <button class="suggestion-card" data-question="Thời khóa biểu lớp 6A?">
                        <span class="suggestion-icon">📅</span>
                        <span class="suggestion-text">Thời khóa biểu lớp 6A?</span>
                    </button>
                    <button class="suggestion-card" data-question="Lịch thi sắp tới?">
                        <span class="suggestion-icon">📝</span>
                        <span class="suggestion-text">Lịch thi sắp tới?</span>
                    </button>
                    <button class="suggestion-card" data-question="Có thông báo mới nào không?">
                        <span class="suggestion-icon">🔔</span>
                        <span class="suggestion-text">Thông báo mới?</span>
                    </button>
                </div>
            </div>

            <!-- Messages rendered here by JS -->
            <div class="messages" id="messages"></div>
        </div>

        <!-- Input area -->
        <div class="input-area" id="inputArea">
            <div class="input-wrapper">
                <textarea id="messageInput" placeholder="Hỏi về điểm, xếp loại, thời khóa biểu, giáo viên..." rows="1"
                    autofocus></textarea>
                <button class="send-btn" id="sendBtn" title="Gửi" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
            <p class="input-disclaimer">AI có thể mắc lỗi. Hãy xác minh thông tin quan trọng từ nguồn chính thức.</p>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
