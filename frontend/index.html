<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 Tư Vấn Tuyển Sinh AI — CMC University</title>
    <meta name="description"
        content="Chatbot AI tư vấn tuyển sinh Trường Đại học CMC — Trả lời chính xác từ tài liệu chính thức.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="newChatBtn" title="Cuộc hội thoại mới">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14" />
                </svg>
                <span>Chat mới</span>
            </button>
            <button class="sidebar-toggle-btn" id="closeSidebarBtn" title="Đóng sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </button>
        </div>

        <div class="sidebar-search">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <path d="M21 21l-4.35-4.35" />
            </svg>
            <input type="text" id="searchInput" placeholder="Tìm kiếm cuộc hội thoại..." autocomplete="off">
        </div>

        <nav class="chat-history" id="chatHistory">
            <!-- Rendered by JS -->
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-footer-info">
                <span class="footer-icon">🎓</span>
                <span>CMC University AI</span>
            </div>
        </div>
    </aside>

    <!-- ===== MAIN ===== -->
    <main class="main" id="main">
        <!-- Top bar -->
        <header class="topbar" id="topbar">
            <button class="sidebar-open-btn" id="openSidebarBtn" title="Mở sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12h18M3 6h18M3 18h18" />
                </svg>
            </button>
            <h1 class="topbar-title" id="topbarTitle">Chat mới</h1>
            <div class="topbar-actions" style="display: flex; align-items: center; gap: 15px;">
                <select id="llmProvider" class="provider-select" title="Chọn Mô Hình AI">
                    <option value="openrouter" selected>Nemotron 70B (Nvidia)</option>
                    <option value="groq">Qwen3 32B (Groq)</option>
                    <option value="gemini">Gemini (from GEMINI_MODEL)</option>
                    <option value="gemini_2_5_flash">Gemini 2.5 Flash</option>
                    <option value="gemini_2_0_flash">Gemini 2.0 Flash</option>
                    <option value="gemini_1_5_flash">Gemini 1.5 Flash</option>
                    <option value="gemini_1_5_flash_8b">Gemini 1.5 Flash 8B</option>
                </select>
                <div class="topbar-status" id="topbarStatus">
                    <span class="status-dot online"></span>
                    <span>Sẵn sàng</span>
                </div>
            </div>
        </header>

        <!-- Chat messages area -->
        <div class="chat-container" id="chatContainer">
            <!-- Welcome screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-logo">🎓</div>
                <h2 class="welcome-title">Tư Vấn Tuyển Sinh CMC University</h2>
                <p class="welcome-subtitle">Hỏi bất kỳ điều gì về tuyển sinh, ngành học, điểm chuẩn, học bổng...</p>

                <div class="suggestions" id="suggestions">
                    <button class="suggestion-card"
                        data-question="Điểm chuẩn trúng tuyển các ngành năm 2024 là bao nhiêu?">
                        <span class="suggestion-icon">📊</span>
                        <span class="suggestion-text">Điểm chuẩn trúng tuyển các ngành năm 2024?</span>
                    </button>
                    <button class="suggestion-card" data-question="Các phương thức xét tuyển năm 2025 của trường CMC?">
                        <span class="suggestion-icon">📝</span>
                        <span class="suggestion-text">Các phương thức xét tuyển năm 2025?</span>
                    </button>
                    <button class="suggestion-card"
                        data-question="Học phí các ngành tại trường Đại học CMC như thế nào?">
                        <span class="suggestion-icon">💰</span>
                        <span class="suggestion-text">Học phí các ngành như thế nào?</span>
                    </button>
                    <button class="suggestion-card" data-question="Có những chính sách học bổng nào cho sinh viên?">
                        <span class="suggestion-icon">🎯</span>
                        <span class="suggestion-text">Chính sách học bổng cho sinh viên?</span>
                    </button>
                    <button class="suggestion-card"
                        data-question="So sánh ngành Công nghệ thông tin và Khoa học máy tính tại CMC">
                        <span class="suggestion-icon">🔍</span>
                        <span class="suggestion-text">So sánh ngành CNTT và KHMT?</span>
                    </button>
                    <button class="suggestion-card" data-question="Trường Đại học CMC có những ngành đào tạo nào?">
                        <span class="suggestion-icon">🎓</span>
                        <span class="suggestion-text">Trường CMC có những ngành nào?</span>
                    </button>
                </div>
            </div>

            <!-- Messages rendered here by JS -->
            <div class="messages" id="messages"></div>
        </div>

        <!-- Input area -->
        <div class="input-area" id="inputArea">
            <!-- Hidden file input for image upload -->
            <input type="file" id="imageFileInput" accept="image/*" style="display:none">

            <!-- Image preview (shown when an image is selected) -->
            <div class="image-preview-container" id="imagePreviewContainer">
                <div class="image-preview-inner">
                    <img id="imagePreviewImg" src="" alt="Preview">
                    <button class="image-preview-remove" id="imagePreviewRemove" title="Xóa ảnh">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <path d="M18 6L6 18M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="input-wrapper">
                <!-- Upload image button -->
                <button class="upload-img-btn" id="uploadImgBtn" title="Tải ảnh lên để OCR">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8">
                        <rect x="3" y="3" width="18" height="18" rx="3" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <path d="M21 15l-5-5L5 21" />
                    </svg>
                </button>

                <textarea id="messageInput" placeholder="Nhập câu hỏi tuyển sinh..." rows="1" autofocus></textarea>
                <button class="send-btn" id="sendBtn" title="Gửi" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
            <p class="input-disclaimer">AI có thể mắc lỗi. Hãy xác minh thông tin quan trọng từ nguồn chính thức.</p>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
